# A release tag ships: verified on main, built and run by check, attested,
# then drafted. A draft is not public: the maintainer runs it on a board and
# publishes it by hand. No secrets: the job's own token writes the release.
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions: {}

# One release at a time, none cancelled: a half-made draft is a rerun's mess.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # From main only: a tag on any other commit builds nothing.
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: the tag is on main and names the manifest's version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$TAG is not on main" >&2
            exit 1
          fi
          version=$(scripts/version.sh "$GITHUB_SHA") || exit 1
          if [[ $TAG != "v$version" ]]; then
            echo "$TAG does not name the manifest's $version" >&2
            exit 1
          fi

  check:
    needs: verify
    uses: ./.github/workflows/check.yml
    with:
      release: true
    permissions:
      contents: read

  draft:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release
      id-token: write # the attestation's signing identity
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # notes.sh reads back to the release before this one.
          fetch-depth: 0
      # The bytes check ran under e2e, not a rebuild.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: checksums
        working-directory: dist
        run: sha256sum --strict -c SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/magellan-*
      - name: draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          scripts/notes.sh "$TAG" >"$RUNNER_TEMP/notes.md" || exit 1
          gh release create "$TAG" dist/magellan-* dist/SHA256SUMS \
            --draft --verify-tag --title "magellan $TAG" --notes-file "$RUNNER_TEMP/notes.md"
