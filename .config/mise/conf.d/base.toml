# templates/base: copy to .config/mise/conf.d/base.toml. Hooks and make run
# these, never whatever apt left on PATH. A bump is a version here and
# `make deps`.
[settings]
# A release is taken a day after it ships: time for a bad one to be pulled.
# make upgrade holds back what this refuses; dprint and cargo name the same day
# in their own places.
minimum_release_age = "1d"

[tools]
lefthook = "2.2.2"
# commitlint and the config-conventional it bundles: no package.json needed.
node = "26.12.1"
"npm:@commitlint/cli" = "21.2.4"
