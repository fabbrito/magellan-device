# This repo's own tools; the gate's are repokit's copies in .config/mise/conf.d/.
# Pinned: a formatter that drifts turns a green tree red with no edit. Rust is
# rustup's, in rust-toolchain.toml. `make upgrade` bumps them, cooled.
min_version = "2026.9"

[tools]
# The C toolchain and linker for every release target (Makefile TARGETS).
zig = "0.17.0"
# Not in mise's registry, so named by their release source.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.150"
"aqua:rust-cross/cargo-zigbuild" = "0.24.0"
