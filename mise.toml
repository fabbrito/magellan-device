# Every tool the gate and the targets run, pinned: a formatter that drifts
# turns a green tree red with no edit. Rust is rustup's, in rust-toolchain.toml.
# A bump is a version here and `make hooks`.
min_version = "2026.9"

[tools]
lefthook = "2.1.14"
dprint = "0.57.4"
shfmt = "3.14.1"
shellcheck = "0.11.0"
# Not in mise's registry, so named by their release source.
"aqua:nextest-rs/nextest/cargo-nextest" = "0.9.146"
"github:cross-rs/cross" = "0.2.5"
