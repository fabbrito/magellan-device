# The commit gate: repokit's templates, copied into .config/lefthook/ and owned
# here. Message policy is .config/commitlint.config.mjs. Clippy and the tests are not
# lanes - neither is fast enough to sit between you and a commit; `make lint` /
# `make test`.
#
# This repo's own jobs go below - never a name a template uses: the extended
# job wins.
extends:
  - .config/lefthook/base.yml
  - .config/lefthook/shell.yml
  - .config/lefthook/dprint.yml
  - .config/lefthook/rust.yml

# Workflows: actionlint reads them, shellcheck their `run:`s with it; pinact
# refuses an action not pinned by sha. Offline: the pin's shape, not its age.
pre-commit:
  jobs:
    - name: actionlint
      glob: &workflow [".github/workflows/*.{yml,yaml}"]
      file_types: &file [not symlink]
      run: actionlint {staged_files}
    - name: pinact
      glob: *workflow
      file_types: *file
      run: pinact run --fix=false --no-api {staged_files}
