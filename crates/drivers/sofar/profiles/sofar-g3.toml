# Sofar G3 family. Generated once from reference/sofar-g3-modbus.md, now the source of truth.
#
# `exponent` says what the raw register means: the physical value is `raw × 10^exponent`, so a
# register the manufacturer documents with a 0.1 factor carries `exponent = -1` and the integer
# travels untouched. Absent means the register is already the value.
[profile]
name = "sofar-g3"
source = "Sofar G3 Modbus protocol, community register table, protocol 1.07 era"

# Polled in this order each sweep; names label the log. Each range here is one
# that answered on the wire — change a qty only with a capture to back it.

[[range]]
name = "system-info"
addr = 0x0400
qty = 47

[[range]]
name = "grid-output"
addr = 0x0480
qty = 48

[[range]]
name = "pv-input"
addr = 0x0580
qty = 10

[[range]]
name = "power"
addr = 0x0680
qty = 28

# Static: a mask, the protocol version, three chip codes. Re-read every sweep
# anyway — a value that changes means the inverter restarted under us.
[[range]]
name = "general"
addr = 0x0040
qty = 48

# Bounds (`min`/`max`) are written in the physical unit, not in raw registers. They reject
# garbage on the wire, not faults: physical limits for the whole G3 family, never this unit's
# rating.

