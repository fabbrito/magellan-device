[package]
name = "runtime"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
contract = { path = "../contract" }
driver = { path = "../driver" }
jiff = { workspace = true }
platform = { path = "../platform" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time"] }
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
# `test-util` pauses time, so a test of the drain loop measures its sleeps without taking them.
# `net` and `io-util` stand a loopback listener in for the cloud where the request's own headers are
# what is under test.
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt", "test-util"] }

[features]
# A fake cloud, for tests that exercise the drain without a network. Off by default, so nothing
# reachable from a release build carries it.
fake = []

[lints]
workspace = true
