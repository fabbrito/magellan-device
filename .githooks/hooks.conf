# This repo's whole hook policy. The engine beside it is vendored from
# fabbrito/githooks v0.2.3 — bump it by copying a newer tag, edit this.
# The version is named here and nowhere else, so a bump is one file.
schema = 1

types       = feat fix refactor chore style docs test ci build perf
subject_max = 72
bullet_max  = 2
body_cols   = 80

# Cross-cutting names first, then one scope per crate.
scope_fixed = repo deps docs
scope_root  = crates/*/

trailer_person    = Co-Authored-By Signed-off-by Reviewed-by
trailer_reference = Refs Closes Fixes

# require is true everywhere: AGENTS.md forbids a red tree, and a lane that
# skipped itself is not a green commit. Clippy and the test suite stay in `make
# lint` / `make test` — neither is fast enough to sit between you and a commit.

# Whole tree, not the staged paths: cargo cannot compile a half-staged file, and
# a formatted crate can still fail to build against an unformatted one.
[group rust]
match   = *.rs Cargo.toml */Cargo.toml Cargo.lock rustfmt.toml
scope   = tree
require = true
run     = cargo fmt --all --check
fix     = cargo fmt --all
run     = cargo check --workspace --all-targets

# .githooks/githooks is left out of match — upstream's formatting is not ours
# to grade, and a style bump upstream would go red on an old vendored copy.
[group shell]
match   = *.sh .githooks/commit-msg .githooks/pre-commit
scope   = staged
require = true
run     = shfmt -i 0 -ci -d
fix     = shfmt -i 0 -ci -w
run     = shellcheck -x -P scripts

# Everything cargo does not own: markdown, and the toml and json config that
# would otherwise match no lane and so be graded by nothing. Cargo.toml matches
# here and in [rust] — dprint formats it, cargo check reads it, both wanted.
[group format]
match   = *.md *.toml *.json
scope   = staged
require = true
run     = dprint check
fix     = dprint fmt
